name: stockfish_engine_flutter
description: >-
  The Stockfish chess engine (GPL-3.0) for Flutter. Runs as a separate
  process on Android and through FFI on iOS; exposes a UCI stdin/stdout API.
version: 0.1.0
repository: https://github.com/mihirjoshi21/stockfish_engine_flutter
issue_tracker: https://github.com/mihirjoshi21/stockfish_engine_flutter/issues

environment:
  sdk: ^3.0.0
  flutter: '>=3.10.0'

dependencies:
  ffi: ^2.0.0
  flutter:
    sdk: flutter
  logging: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.stockfish
        pluginClass: StockfishPlugin
      ios:
        pluginClass: StockfishPlugin
